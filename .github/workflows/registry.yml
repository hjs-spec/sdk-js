name: Publish existing release to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download this version's new-scope release only
        run: gh release download "v$(cat VERSION)" -p "hjs-api-db-jep-sdk-js-$(cat VERSION).tgz" --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish through separately configured registry.yml trust
        run: npm publish ./dist/*.tgz --access public --provenance --registry=https://registry.npmjs.org/
