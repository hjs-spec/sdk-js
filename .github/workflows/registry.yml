name: Publish existing release to npm
on:
  push:
    branches: [main]
    paths: ['.github/workflows/registry.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: gh release download "v$(cat VERSION)" -p '*.tgz' --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish ./dist/*.tgz --access public --provenance
