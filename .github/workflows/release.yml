name: Publish versioned release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish this release to npm (currently paused)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: mkdir -p dist && npm pack --pack-destination dist
      - name: Validate release version
        run: |
          python -c "import pathlib,re; v=pathlib.Path('VERSION').read_text().strip(); assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+)?',v)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'This version already has a release; refusing to overwrite it.'
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file RELEASE-NOTES.md dist/*
  npm:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: npm publish ./dist/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
